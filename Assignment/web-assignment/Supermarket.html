<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0; background-color: rgb(208, 228, 208);
        }
        .header{
            background-color: rgb(21, 141, 21); color: white;
           text-align: center; padding: 20px; font-size: 20px;
        }
        .nav{
            background-color: darkgreen; padding: 10px; text-align: center;
        }
        .nav a{
            color: white;  margin: 15px; text-decoration: none;   font-weight: bold;
        }
        .container{
            padding-bottom: 20px;
        }
        .our{
            text-align: center; font-size: 30px;color: darkgreen; font-weight: bolder;
        }
        .product{
            display: flex; justify-content: space-around; flex-wrap: wrap;
        }
        .pro{
            background-color: white; width: 200px;margin: 10px; padding: 15px; text-align: center;
            box-shadow: 0px 0px 10px gray; border-radius: 10px;
        }
        .pro img{
            width: 100%; height: 120px; 
        }
        .price{
            color: red; font-size: 18px; font-weight: bold;
        }
        button{
            background-color: green; color: white; border: none ; padding: 5px; cursor: pointer;
        }
        .footer{
            background-color: green; color: white;padding: 15px; font-size: 15px;  text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Fresh Super Market</h1>
        <p>Your Daily <Noscript></Noscript>eed at One Place</p>
    </div>
    <div class="nav">
   <a href="#"> Home</a>
   <a href="#">Product</a>
    <a href="#">offers</a>
   <a href="#">Contact</a>
   </div>
   <div class="container">
    <h2 class="our">Our Products </h2>
    <div class="product">
        <div class="pro">
            <img src="/My Project/any/img2.jpg" alt="Rice">
            <h3>Rice</h3>
            <p class="price">50rupees/kg</p>
            <button>Buy Now</button>
        </div>
        
        <div class="pro">
            <img src="/My Project/any/img2.jpg" alt="Rice">
            <h3>Fruits</h3>
            <p class="price">50rupees/kg</p>
            <button>Buy Now</button>
        </div>
        <div class="pro">
            <img src="/My Project/any/img2.jpg" alt="Rice">
            <h3>Vegatables</h3>
            <p class="price">50rupees/kg</p>
            <button>Buy Now</button>
        </div>
    </div>
   </div>
   <div class="footer">
    <p>2026 Fresh Super Market || All Rights Reserved</p>
   </div>
</body>
</html>
