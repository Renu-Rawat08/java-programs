<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        #my-button{
            height: 50px;
            width: 50px;
            font-size: 20px;
               }
        .js-odd{
            background-color: chocolate;
        }
        .js-even{
            background-color: lawngreen;
        }
    </style>
</head>
<body>
    <h3 id="greeting"></h3>
    <button id="my-button" onclick="buttonPressed();">0</button>
   
    <script>
        let noOfclicked = 0;
        function buttonPressed(){
            noOfclicked++;
            updatebutton();
        }


        function updatebutton(){
            let button = document.querySelector('#my-button');
            if(noOfclicked % 2 ===0){
                button.classList.remove('js-odd');
                button.classList.add('js-even');
            }else{
                button.classList.remove('js-even');
                 button.classList.add('js-odd');
            }
                    button.innerText = noOfclicked;

        }
        function  dogreeting(personName = 'Dear'){
        let date = new Date();
        let hours = date.getHours();
        let heading = document.querySelector('#greeting');
        console.log(hours);
        if( hours > 5&&hours < 12){
            heading.innerText = `Good morning ${personName}`;
        }else if(hours > 12 && hours < 18){
            heading.innerText = `Good Afternoon ${personName}`;
        }else{
            heading.innerText = `Good Night ${personName}`;
        }
    }
    dogreeting('renu');
    </script>
</body>
</html>
