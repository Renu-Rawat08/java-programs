<!DOCTYPE html>
<html>
    <head>
        <title>Ajax example</title>
    </head>
    <body>
        <h2>AJAX demo</h2>
        <button onclick="loadData()">Load data</button>
        <div id="result"></div>
        <script>
            function loadData(){
                var xhr = new XMLHttpRequest();
                xhr.open("GET","data.txt",true);
                xhr.onload = function(){
                    if(xhr.status === 200){
                        document.getElementById("result").innerHTML = xhr.responseText;
                    }
                };
                xhr.send();
            }
        </script>
    </body>
</html>
